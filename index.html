-- admin proxy filtering, debug logging, fixed spin, fling, and auto-stat syncing 💅

local Players = game:GetService("Players")
local RunService = game:GetService("RunService")
local UserInputService = game:GetService("UserInputService")
local TextChatService = game:FindService("TextChatService")
local ReplicatedStorage = game:GetService("ReplicatedStorage")
local HttpService = game:GetService("HttpService")
local GuiService = game:GetService("GuiService")
local ScriptContext = game:GetService("ScriptContext")

local localPlayer = Players.LocalPlayer

-- ✨ configuration & state ✨
local owners = { ["tayIorkeke33"] = true }
local isMain = owners[localPlayer.Name] or false
local ipcFile = "keke_ipc.txt"
local logFile = "keke_debug_logs.txt"
local lastProcessedTick = 0

local lastWs = 16
local lastJp = 50

local connections: { RBXScriptConnection } = {}

-- movement & anim states
local bangAnim: Animation? = nil
local bangTrack: AnimationTrack? = nil
local bangDiedConn: RBXScriptConnection? = nil
local bangLoopConn: RBXScriptConnection? = nil

local danceTrack: AnimationTrack? = nil

local followTarget = nil
local followConn = nil
local posQueue = {} 

local infJumpConn = nil
local noclipConn = nil
local flingConn = nil

-- 💅 secret dictionary for the commands 💅
local cmdMap = {
	bring = "k", goto = "g", follow = "f", unfollow = "u", 
	bang = "b", unbang = "x", spin = "s", unspin = "y", 
	jump = "j", sit = "t", freeze = "z", thaw = "w", 
	infjump = "i", uninf = "o", line = "l", column = "c", 
	dance = "d", undance = "v", noclip = "n", clip = "p",
	fling = "fl", unfling = "uf", ws = "ws", jp = "jp",
	quit = "q", erase = "e", reset = "r", grant = "h"
}

-- 📝 the debugging sector 📝
local function logDebug(msg: string)
	pcall(function()
		local timeStr = os.date("%H:%M:%S")
		local line = string.format("[%s] [%s] %s\n", timeStr, localPlayer.Name, msg)
		
		if appendfile then
			appendfile(logFile, line)
		elseif writefile and readfile then
			local current = ""
			if isfile and isfile(logFile) then
				current = readfile(logFile) or ""
			end
			writefile(logFile, current .. line)
		end
	end)
end

ScriptContext.Error:Connect(function(message, trace)
	logDebug("🐛 caught error: " .. tostring(message))
end)

logDebug("✨ luxury manager active! isMain: " .. tostring(isMain))

-- 💅 helpers 💅
local function getRoot(char: Instance): BasePart?
	if not char then return nil end
	return char:FindFirstChild("HumanoidRootPart") :: BasePart
end

local function getTorso(char: Instance): BasePart?
	if not char then return nil end
	return (char:FindFirstChild("Torso") or char:FindFirstChild("UpperTorso")) :: BasePart
end

local function isR15(char: Instance): boolean
	local hum = char and char:FindFirstChildOfClass("Humanoid")
	return hum and hum.RigType == Enum.HumanoidRigType.R15 or false
end

local function findPlayersByName(query: string): { Player }
	local results = {}
	if not query or query == "" then return results end
	local lower = string.lower(query)
	for _, p in ipairs(Players:GetPlayers()) do
		if string.find(string.lower(p.Name), lower, 1, true) then
			table.insert(results, p)
		end
	end
	return results
end

-- 📝 universally send a command to the secret file
local function sendCommand(cmdLetter: string, args: string, senderOverride: string?)
	pcall(function()
		if writefile then
			local data = {
				t = os.clock() + math.random(),
				s = senderOverride or localPlayer.Name,
				c = cmdLetter,
				a = args or ""
			}
			logDebug("📤 pushing command to file: " .. cmdLetter .. " | args: " .. tostring(args))
			writefile(ipcFile, HttpService:JSONEncode(data))
		end
	end)
end

-- 🏃‍♀️ command implementations 🏃‍♀️
local function cleanupBang()
	if bangDiedConn then pcall(function() bangDiedConn:Disconnect() end) end
	if bangLoopConn then pcall(function() bangLoopConn:Disconnect() end) end
	bangDiedConn = nil
	bangLoopConn = nil
	if bangTrack then pcall(function() bangTrack:Stop() end) end
	if bangAnim then pcall(function() bangAnim:Destroy() end) end
	bangTrack = nil
	bangAnim = nil
end

local function cmd_reset()
	local char = localPlayer.Character
	if char then
		local hum = char:FindFirstChildOfClass("Humanoid")
		if hum then hum.Health = 0 end
	end
end

local function cmd_goto(targetName: string)
	if not targetName or targetName == "" then return end
	local targets = findPlayersByName(targetName)
	if #targets == 0 then return end

	local targetPlayer = targets[1]
	if targetPlayer == localPlayer then return end

	local myChar = localPlayer.Character
	local otherChar = targetPlayer.Character
	if not myChar or not otherChar then return end

	local myHum = myChar:FindFirstChildOfClass("Humanoid")
	if myHum and myHum.SeatPart then
		myHum.Sit = false
		task.wait(0.1)
	end

	local myRoot = getRoot(myChar)
	local otherRoot = getRoot(otherChar)
	if myRoot and otherRoot then
		myRoot.CFrame = otherRoot.CFrame + Vector3.new(2, 0, 2)
		pcall(function()
			myRoot.AssemblyLinearVelocity = Vector3.zero
			myRoot.AssemblyAngularVelocity = Vector3.zero
		end)
	end
end

local function cmd_bang(targetName: string, speed: string?)
	cleanupBang()
	task.wait()

	local char = localPlayer.Character or localPlayer.CharacterAdded:Wait()
	local hum = char:FindFirstChildOfClass("Humanoid")
	if not hum then return end

	local animator = hum:FindFirstChildOfClass("Animator") or Instance.new("Animator", hum)
	bangAnim = Instance.new("Animation")
	bangAnim.AnimationId = (isR15(char) and "rbxassetid://5918726674") or "rbxassetid://148840371"

	pcall(function() bangTrack = animator:LoadAnimation(bangAnim) end)
	if bangTrack then
		bangTrack:Play(0.1, 1, 1)
		pcall(function() bangTrack:AdjustSpeed(tonumber(speed) or 3) end)
	end

	bangDiedConn = hum.Died:Connect(function() cleanupBang() end)

	if targetName and targetName ~= "" then
		local targets = findPlayersByName(targetName)
		if #targets > 0 then
			local targetPlayer = targets[1]
			if targetPlayer == localPlayer then return end
			
			local offset = CFrame.new(0, 0, 1.1)
			bangLoopConn = RunService.Stepped:Connect(function()
				pcall(function()
					local otherTorso = getTorso(targetPlayer.Character)
					local myRoot = getRoot(char)
					if otherTorso and myRoot then
						myRoot.CFrame = otherTorso.CFrame * offset
					end
				end)
			end)
		end
	end
end

local function cmd_follow(targetName: string)
	if followConn then pcall(function() followConn:Disconnect() end) followConn = nil end
	posQueue = {} 
	
	if not targetName or targetName == "" then return end
	local targets = findPlayersByName(targetName)
	if #targets == 0 then return end
	
	followTarget = targets[1]
	if followTarget == localPlayer then 
		followTarget = nil 
		return 
	end
	
	followConn = RunService.Heartbeat:Connect(function()
		if not followTarget or not followTarget.Character then return end
		local myChar = localPlayer.Character
		if not myChar then return end
		local myHum = myChar:FindFirstChildOfClass("Humanoid")
		local targetRoot = getRoot(followTarget.Character)
		
		if myHum and targetRoot then
			table.insert(posQueue, {pos = targetRoot.Position, time = tick()})
			while #posQueue > 0 and tick() - posQueue[1].time >= 0.85 do
				local delayedPoint = table.remove(posQueue, 1)
				myHum:MoveTo(delayedPoint.pos)
			end
		end
	end)
end

local function cmd_unfollow()
	followTarget = nil
	posQueue = {}
	if followConn then pcall(function() followConn:Disconnect() end) followConn = nil end
end

local function cmd_formation(senderName: string, isSideways: boolean)
	cmd_unfollow()
	cmd_unspin()
	cleanupBang()

	local leader = Players:FindFirstChild(senderName)
	if not leader or not leader.Character then return end
	local leaderRoot = getRoot(leader.Character)
	if not leaderRoot then return end

	local myChar = localPlayer.Character
	if not myChar then return end
	local myHum = myChar:FindFirstChildOfClass("Humanoid")
	if myHum and myHum.SeatPart then
		myHum.Sit = false
		task.wait(0.1)
	end

	local myRoot = getRoot(myChar)
	if not myRoot then return end

	local nearby = {}
	for _, p in ipairs(Players:GetPlayers()) do
		if p.Name ~= senderName and p.Character then
			local r = getRoot(p.Character)
			if r and (r.Position - leaderRoot.Position).Magnitude < 300 then
				table.insert(nearby, p.Name)
			end
		end
	end
	table.sort(nearby)

	local myIndex = 1
	for i, n in ipairs(nearby) do
		if n == localPlayer.Name then myIndex = i break end
	end

	local offset
	if isSideways then
		local sign = myIndex % 2 == 0 and 1 or -1
		local mult = math.ceil(myIndex / 2)
		offset = CFrame.new(sign * mult * 7, 0, 0)
	else
		offset = CFrame.new(0, 0, myIndex * 7)
	end

	followConn = RunService.Heartbeat:Connect(function()
		local currLeader = Players:FindFirstChild(senderName)
		if not currLeader or not currLeader.Character then return end
		local lRoot = getRoot(currLeader.Character)
		if myHum and lRoot then
			myHum:MoveTo((lRoot.CFrame * offset).Position)
		end
	end)
end

local function cmd_spin(speedArg: string?)
	cmd_unspin() 
	local root = getRoot(localPlayer.Character)
	if root then
		local att = Instance.new("Attachment", root)
		att.Name = "KekeSpinAtt"
		local av = Instance.new("AngularVelocity", root)
		av.Name = "KekeSpin"
		av.Attachment0 = att
		av.AngularVelocity = Vector3.new(0, tonumber(speedArg) or 25, 0)
		av.MaxTorque = math.huge
		av.RelativeTo = Enum.ActuatorRelativeTo.Attachment0
	end
end

local function cmd_unspin()
	local root = getRoot(localPlayer.Character)
	if root then
		local av = root:FindFirstChild("KekeSpin")
		if av then av:Destroy() end
		local att = root:FindFirstChild("KekeSpinAtt")
		if att then att:Destroy() end
	end
end

local function cmd_fling()
	cmd_unfling()
	local root = getRoot(localPlayer.Character)
	local char = localPlayer.Character
	if root and char then
		local bav = Instance.new("BodyAngularVelocity", root)
		bav.Name = "KekeFlingBAV"
		bav.AngularVelocity = Vector3.new(0, 99999, 0)
		bav.MaxTorque = Vector3.new(0, math.huge, 0)
		bav.P = math.huge
		
		for _, v in ipairs(char:GetDescendants()) do
			if v:IsA("BasePart") then
				v.CustomPhysicalProperties = PhysicalProperties.new(100, 0.3, 0.5)
			end
		end
	end
end

local function cmd_unfling()
	local root = getRoot(localPlayer.Character)
	local char = localPlayer.Character
	if root then
		local bav = root:FindFirstChild("KekeFlingBAV")
		if bav then bav:Destroy() end
	end
	if char then
		for _, v in ipairs(char:GetDescendants()) do
			if v:IsA("BasePart") then
				v.CustomPhysicalProperties = PhysicalProperties.new(0.7, 0.3, 0.5)
			end
		end
	end
end

local function cmd_dance()
	local char = localPlayer.Character
	local hum = char and char:FindFirstChildOfClass("Humanoid")
	if not hum then return end

	if danceTrack then pcall(function() danceTrack:Stop() end) end

	local animator = hum:FindFirstChildOfClass("Animator") or Instance.new("Animator", hum)

	pcall(function()
		danceTrack = animator:LoadAnimation(anim)

		pcall(function() danceTrack:Stop() end)

	end
end

end

local function cmd_sit()

	if noclipConn then noclipConn:Disconnect() end
	noclipConn = RunService.Stepped:Connect(function()
		local char = localPlayer.Character
		if char then
			for _, part in ipairs(char:GetDescendants()) do
				if part:IsA("BasePart") and part.CanCollide then

			hum:ChangeState(Enum.HumanoidStateType.Jumping)

end

local function cmd_grant(targetName: string)

	local targets = findPlayersByName(targetName)
	local actualName = targetName
	if #targets > 0 then actualName = targets[1].Name end

end

end

-- 🌈 flawless execution engine 🌈
local function executeCommand(senderName: string, cmdLetter: string, targetArg: string)
	local target = targetArg or ""
	local extra = ""
	if string.find(target, " ") then
		local split = string.split(target, " ")
		target = split[1]
		extra = split[2]
	end

	if senderName == localPlayer.Name and isMain then
		if string.lower(target) ~= "all" then return end
	end

	if target ~= "" and string.lower(target) ~= "all" then
		local foundTargets = findPlayersByName(target)
		local amITargeted = false
		for _, p in ipairs(foundTargets) do
			if p == localPlayer then amITargeted = true break end
		end
		if not amITargeted and cmdLetter ~= "ws" and cmdLetter ~= "jp" then return end
	end
	
	logDebug("📥 executing parsed command: " .. cmdLetter .. " | target: " .. tostring(target))

	if cmdLetter == "r" or cmdLetter == "reset" then cmd_reset()
	elseif cmdLetter == "b" or cmdLetter == "bang" then cmd_bang(target, extra)
	elseif cmdLetter == "x" or cmdLetter == "unbang" then cleanupBang()
	elseif cmdLetter == "g" or cmdLetter == "goto" then cmd_goto(senderName) 
	elseif cmdLetter == "k" or cmdLetter == "bring" then cmd_goto(senderName)
	elseif cmdLetter == "f" or cmdLetter == "follow" then cmd_follow(senderName)
	elseif cmdLetter == "u" or cmdLetter == "unfollow" then cmd_unfollow()
	elseif cmdLetter == "l" or cmdLetter == "line" then cmd_formation(senderName, true)
	elseif cmdLetter == "c" or cmdLetter == "column" then cmd_formation(senderName, false)
	elseif cmdLetter == "s" or cmdLetter == "spin" then cmd_spin(extra)
	elseif cmdLetter == "y" or cmdLetter == "unspin" then cmd_unspin()
	elseif cmdLetter == "fl" or cmdLetter == "fling" then cmd_fling()
	elseif cmdLetter == "uf" or cmdLetter == "unfling" then cmd_unfling()
	elseif cmdLetter == "d" or cmdLetter == "dance" then cmd_dance()
	elseif cmdLetter == "v" or cmdLetter == "undance" then cmd_undance()
	elseif cmdLetter == "n" or cmdLetter == "noclip" then cmd_noclip()
	elseif cmdLetter == "p" or cmdLetter == "clip" then cmd_clip()
	elseif cmdLetter == "q" or cmdLetter == "quit" then cmd_quit()
	elseif cmdLetter == "j" or cmdLetter == "jump" then cmd_jump()
	elseif cmdLetter == "t" or cmdLetter == "sit" then cmd_sit()
	elseif cmdLetter == "z" or cmdLetter == "freeze" then cmd_freeze()
	elseif cmdLetter == "w" or cmdLetter == "thaw" then cmd_thaw()
	elseif cmdLetter == "i" or cmdLetter == "infjump" then cmd_infjump()
	elseif cmdLetter == "o" or cmdLetter == "uninf" then cmd_uninf()
	elseif cmdLetter == "ws" then
		local char = localPlayer.Character
		if char and char:FindFirstChildOfClass("Humanoid") then
			char:FindFirstChildOfClass("Humanoid").WalkSpeed = tonumber(target) or 16
		end
	elseif cmdLetter == "jp" then
		local char = localPlayer.Character
		if char and char:FindFirstChildOfClass("Humanoid") then
			local hum = char:FindFirstChildOfClass("Humanoid")
			hum.JumpPower = tonumber(target) or 50
			hum.UseJumpPower = true
		end
	elseif cmdLetter == "e" or cmdLetter == "erase" then 
		cmd_unfollow()
		cmd_unspin()
		cleanupBang()
		cmd_uninf()
		cmd_undance()
		cmd_clip()
		cmd_unfling()
	elseif cmdLetter == "h" or cmdLetter == "grant" then cmd_grant(target)
	end
end

local function handleIncomingChat(senderName: string, text: string)
	if not isMain then return end 
	if not owners[senderName] then return end
	if string.sub(text, 1, 1) ~= "." then return end

	local parts = {}
	for token in string.gmatch(text, "%S+") do table.insert(parts, token) end
	if #parts == 0 then return end
	
	local cmdWord = string.lower(string.sub(parts[1], 2))
	local target = parts[2] or ""
	local extra = parts[3] or ""

	local letter = cmdMap[cmdWord] or cmdWord
	
	logDebug("💬 parsed chat from " .. senderName .. ": " .. cmdWord)
	sendCommand(letter, target .. (extra ~= "" and (" " .. extra) or ""), senderName)
end

				logDebug("🏃‍♀️ walkspeed changed locally to: " .. tostring(lastWs))
				sendCommand("ws", tostring(lastWs))
			end
			if hum.JumpPower ~= lastJp then

			end

	end)
end

if not isMain then

end

RunService.Heartbeat:Connect(function()

		if isfile and isfile(ipcFile) then
			local content = readfile(ipcFile)
			if content and content ~= "" then
				local data = HttpService:JSONDecode(content)
				if data and data.t and data.t > lastProcessedTick then
					lastProcessedTick = data.t
					executeCommand(data.s, data.c, data.a)
				end
			end
		end
	end)
end)

local function connectTextChatService()
	if not TextChatService then return end
	local conn = TextChatService.MessageReceived:Connect(function(message)
		local text = message and message.Text or ""
		local source = message and message.TextSource
		local name = source and source.Name or ""
		if text ~= "" and name ~= "" then handleIncomingChat(name, text) end
	end)
	table.insert(connections, conn)
end

local function connectLegacyChat()
	local defaultEvents = ReplicatedStorage:FindFirstChild("DefaultChatSystemChatEvents")
	if not defaultEvents then return end
	local onMessage = defaultEvents:FindFirstChild("OnMessageDoneFiltering")
	if not onMessage or not onMessage:IsA("RemoteEvent") then return end
	local conn = onMessage.OnClientEvent:Connect(function(data)
		local text = data and data.Message or ""
		local name = data and data.FromSpeaker or ""
		if text ~= "" and name ~= "" then handleIncomingChat(name, text) end
	end)
	table.insert(connections, conn)
end

if isMain then
	if TextChatService and TextChatService:FindFirstChild("ChatVersion") == nil then
		connectTextChatService()
	else
		connectTextChatService()
		if #connections == 0 then connectLegacyChat() end
	end
